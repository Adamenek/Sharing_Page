
name: Update Einstein@Home stats

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch Einstein@Home stats
        id: fetch
        run: |
          set -eu

          URL="https://einsteinathome.org/show_user.php?userid=1065477&format=xml"

          STATUS=$(curl -L -sS \
            --connect-timeout 15 \
            --max-time 30 \
            -o /tmp/einstein.xml \
            -w "%{http_code}" \
            "$URL" || true)

          echo "HTTP status: $STATUS"
          echo "Response preview:"
          head -c 1000 /tmp/einstein.xml || true
          echo

          if [ "$STATUS" != "200" ]; then
            echo "Einstein@Home request failed with HTTP $STATUS"
            exit 1
          fi

          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from pathlib import Path

          root = ET.parse("/tmp/einstein.xml").getroot()

          if root.tag.lower() == "error":
              raise SystemExit(
                  "Einstein@Home returned an XML error: "
                  + ET.tostring(root, encoding="unicode")
              )

          def get_value(name):
              element = root.find(name)
              if element is None or element.text is None:
                  raise SystemExit(f"Missing XML field: {name}")
              return element.text.strip()

          data = {
              "user_id": get_value("id"),
              "name": get_value("name"),
              "total_credit": float(get_value("total_credit")),
              "expavg_credit": float(get_value("expavg_credit")),
              "updated_at": datetime.now(timezone.utc).isoformat()
          }

          Path("einstein-stats.json").write_text(
              json.dumps(data, indent=2) + "\n",
              encoding="utf-8"
          )

          print(json.dumps(data, indent=2))
          PY

     
      - name: Commit updated stats
        run: |
          git add einstein-stats.json

          if git diff --cached --quiet; then
            echo "Stats have not changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Update Einstein@Home stats"
          git push


          git add einstein-stats.json
          git commit -m "Update Einstein@Home stats"
          git push
