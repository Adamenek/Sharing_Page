name: Daily Random NASA Picture

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-picture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch daily NASA picture
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: python fetch_nasa.py

      - name: Commit daily picture data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nasa-today.json
          git diff --cached --quiet || git commit -m "Update daily NASA picture"
          git push

