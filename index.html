<body>
    <main class="container">
        <h1>Sharing_Page</h1>
        <p class="subtitle">Adam</p>

        <section class="boinc-card" aria-labelledby="boinc-title">
            <div class="boinc-heading">
                <div class="boinc-heading-left">
                    <div class="entry-title" id="boinc-title">Einstein@Home</div>
                    <div class="boinc-subtitle">Distributed computing</div>
                </div>
                <div class="flags" aria-label="Switzerland and Czechia">
                    <span class="flag" title="Switzerland" aria-label="Switzerland">🇨🇭</span>
                    <span class="flag" title="Czechia" aria-label="Czechia">🇨🇿</span>
                </div>
            </div>

            <div class="boinc-divider"></div>

            <div class="boinc-status-row">
                <div class="boinc-status">
                    <span class="dot" id="boinc-dot"></span>
                    <span id="boinc-status">Connecting to profile</span>
                </div>
                <button class="refresh-button" id="boinc-refresh" type="button">Refresh ↻</button>
            </div>

            <div class="boinc-stats" id="boinc-stats" aria-live="polite">
                <div class="boinc-stat">
                    <div class="boinc-value">—</div>
                    <div class="boinc-label">Total credit</div>
                </div>
                <div class="boinc-stat">
                    <div class="boinc-value">—</div>
                    <div class="boinc-label">Recent average credit</div>
                </div>
            </div>

            <div class="boinc-message" id="boinc-message" hidden></div>

            <div class="boinc-note">
                <a class="boinc-link" href="https://einsteinathome.org/de/userw.php?id=1065477">View Einstein@Home profile ↗</a>
                <span id="boinc-updated"></span>
            </div>
        </section>

        <div id="entries"></div>
    </main>

    <script>
        const entries = [
            {
                title: "Neutron Stars; When Gravity Outweighs Atomic Physics",
                date: "21.08.2026",
                type: "pdf",
                description: "Talking about neutron stars",
                links: [
                    { label: "Open PDF →", url: "./Neutron Stars; When gravity outweighs atomic Physic.pdf" }
                ]
            },
            {
                title: "Gravity; Why It's Not a Force",
                date: "17.06.2026",
                type: "pdf",
                description: "Proving that gravity is not a force",
                links: [
                    { label: "Open PDF →", url: "./Gravity; Why Its Not a Force.pdf" }
                ]
            },
            {
                title: "Black Holes; We Don't Know Is Not an Equation",
                date: "16.06.2026",
                type: "pdf",
                description: "Counter argument in the black hole debate",
                links: [
                    { label: "Open PDF →", url: "./Black Holes; We dont Know is not an equation.pdf" }
                ]
            }
        ];

        const badgeLabels = {
            pdf: "PDF",
            "3d": "3D File",
            project: "Project"
        };

        const entriesContainer = document.getElementById("entries");

        if (entries.length === 0) {
            entriesContainer.innerHTML = '<div class="empty">Nothing here yet. Add an entry above!</div>';
        } else {
            entries.forEach(item => {
                const article = document.createElement("article");
                article.className = "entry";

                const header = document.createElement("div");
                header.className = "entry-header";

                const title = document.createElement("div");
                title.className = "entry-title";
                title.textContent = item.title;

                const badge = document.createElement("span");
                badge.className = "badge " + item.type;
                badge.textContent = badgeLabels[item.type] || item.type;

                header.append(title, badge);

                const date = document.createElement("div");
                date.className = "entry-date";
                date.textContent = item.date;

                const description = document.createElement("div");
                description.className = "entry-desc";
                description.textContent = item.description;

                const links = document.createElement("div");
                links.className = "entry-links";

                item.links.forEach(link => {
                    const anchor = document.createElement("a");
                    anchor.href = link.url;
                    anchor.rel = "noopener noreferrer";
                    anchor.textContent = link.label;
                    links.appendChild(anchor);
                });

                article.append(header, date, description, links);
                entriesContainer.appendChild(article);
            });
        }

        const profileUrl = "https://einsteinathome.org/de/userw.php?id=1065477";
        const statsContainer = document.getElementById("boinc-stats");
        const statusText = document.getElementById("boinc-status");
        const statusDot = document.getElementById("boinc-dot");
        const message = document.getElementById("boinc-message");
        const updatedText = document.getElementById("boinc-updated");
        const refreshButton = document.getElementById("boinc-refresh");

        const statDefinitions = [
            {
                label: "Total credit",
                pattern: /\btotal\s+credit\b/i
            },
            {
                label: "Recent average credit",
                pattern: /\b(?:recent\s+)?average\s+credit\b|\b RAC\b/i
            },
            {
                label: "World rank",
                pattern: /\bworld\s+rank\b|\bglobal\s+rank\b/i
            },
            {
                label: "Country",
                pattern: /\bcountry\b/i
            },
            {
                label: "Team",
                pattern: /\bteam\b/i
            },
            {
                label: "Computers",
                pattern: /\bcomputers?\b/i
            },
            {
                label: "Joined",
                pattern: /\bjoined\b|\bmember\s+since\b/i
            }
        ];

        function setStatus(text, connected) {
            statusText.textContent = text;
            statusDot.classList.toggle("on", connected);
        }

        function normalizeText(value) {
            return value.replace(/\s+/g, " ").trim();
        }

        function extractRows(documentNode) {
            const rows = [];

            documentNode.querySelectorAll("tr").forEach(row => {
                const cells = Array.from(row.querySelectorAll("th, td"))
                    .map(cell => normalizeText(cell.textContent))
                    .filter(Boolean);

                if (cells.length >= 2) {
                    rows.push({
                        label: cells[0].replace(/:$/, ""),
                        value: cells.slice(1).join(" · ")
                    });
                }
            });

            documentNode.querySelectorAll("dt").forEach(term => {
                const valueNode = term.nextElementSibling;

                if (valueNode && valueNode.tagName.toLowerCase() === "dd") {
                    rows.push({
                        label: normalizeText(term.textContent).replace(/:$/, ""),
                        value: normalizeText(valueNode.textContent)
                    });
                }
            });

            documentNode.querySelectorAll("li").forEach(item => {
                const text = normalizeText(item.textContent);
                const match = text.match(/^([^:]{2,45}):\s*(.+)$/);

                if (match) {
                    rows.push({
                        label: match[1].trim(),
                        value: match[2].trim()
                    });
                }
            });

            return rows;
        }

        function formatValue(value) {
            const cleaned = normalizeText(value);

            if (!cleaned) {
                return "—";
            }

            const numberMatch = cleaned.match(/^(-?\d[\d,.]*)(.*)$/);

            if (numberMatch) {
                const numberPart = numberMatch[1];
                const suffix = numberMatch[2].trim();

                if (/^\d+$/.test(numberPart)) {
                    const formatted = Number(numberPart).toLocaleString("en-US");
                    return suffix ? formatted + " " + suffix : formatted;
                }
            }

            return cleaned.length > 48
                ? cleaned.slice(0, 45) + "…"
                : cleaned;
        }

        function renderStats(rows) {
            const normalizedRows = rows.map(row => ({
                label: normalizeText(row.label),
                value: normalizeText(row.value)
            }));

            const matched = [];
            const used = new Set();

            statDefinitions.forEach(definition => {
                const index = normalizedRows.findIndex((row, i) =>
                    !used.has(i) &&
                    definition.pattern.test(row.label) &&
                    row.value &&
                    row.value !== row.label
                );

                if (index !== -1) {
                    used.add(index);
                    matched.push({
                        label: definition.label,
                        value: normalizedRows[index].value
                    });
                }
            });

            const displayStats = matched.filter(stat =>
                stat.label !== "Recent average credit" ||
                !matched.some(other =>
                    other !== stat &&
                    other.label === "Total credit" &&
                    other.value === stat.value
                )
            );

            if (displayStats.length === 0) {
                return false;
            }

            statsContainer.replaceChildren();

            displayStats.forEach(stat => {
                const item = document.createElement("div");
                item.className = "boinc-stat";

                const value = document.createElement("div");
                value.className = "boinc-value";
                value.textContent = formatValue(stat.value);
                value.title = stat.value;

                const label = document.createElement("div");
                label.className = "boinc-label";
                label.textContent = stat.label;

                item.append(value, label);
                statsContainer.appendChild(item);
            });

            return true;
        }

        async function loadBoincStats() {
            refreshButton.disabled = true;
            message.hidden = true;
            message.replaceChildren();
            setStatus("Loading statistics", false);

            const proxyUrl =
                "https://api.allorigins.win/raw?url=" +
                encodeURIComponent(profileUrl);

            try {
                const response = await fetch(proxyUrl, {
                    method: "GET",
                    cache: "no-store",
                    headers: {
                        "Accept": "text/html"
                    },
                    signal: AbortSignal.timeout(15000)
                });

                if (!response.ok) {
                    throw new Error("The data service returned HTTP " + response.status);
                }

                const html = await response.text();

                if (!html || html.length < 100) {
                    throw new Error("The profile returned an empty response");
                }

                const parsedDocument = new DOMParser().parseFromString(html, "text/html");
                const pageText = normalizeText(parsedDocument.body.textContent);

                if (
                    !pageText ||
                    /cloudflare|access denied|captcha|temporarily blocked/i.test(pageText.slice(0, 500))
                ) {
                    throw new Error("The profile could not be read");
                }

                const rows = extractRows(parsedDocument);

                if (!renderStats(rows)) {
                    throw new Error("No recognizable statistics were found on the profile");
                }

                setStatus("Profile loaded", true);
                updatedText.textContent = " · Updated " +
                    new Date().toLocaleTimeString([], {
                        hour: "2-digit",
                        minute: "2-digit"
                    });
            } catch (error) {
                setStatus("Statistics unavailable", false);

                message.replaceChildren();

                const text = document.createElement("span");
                text.textContent =
                    "Live statistics could not be retrieved. The data proxy may be unavailable, or the profile layout may have changed. ";

                const link = document.createElement("a");
                link.href = profileUrl;
                link.textContent = "Open profile ↗";

                message.append(text, link);
                message.hidden = false;
            } finally {
                refreshButton.disabled = false;
            }
        }

        refreshButton.addEventListener("click", loadBoincStats);

        loadBoincStats();
    </script>
</body>
</html>
