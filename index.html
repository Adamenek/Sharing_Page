<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sharing_Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fafafa;
            color: #222;
            line-height: 1.6;
            padding: 60px 20px;
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 40px;
        }

        .entry {
            background: #fff;
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 16px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .entry:hover {
            border-color: #ccc;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .entry-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 4px;
        }

        .entry-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #111;
        }

        .badge {
            flex-shrink: 0;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 3px 10px;
            border-radius: 999px;
            background: #f0f0f0;
            color: #666;
        }

        .badge.pdf    { background: #fdeaea; color: #c0392b; }
        .badge.3d     { background: #eaf3fd; color: #2471a3; }
        .badge.project{ background: #eafaf1; color: #1e8449; }
        .badge.boinc  { background: #f5f0fa; color: #7d3c98; }

        .entry-date {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 12px;
        }

        .entry-desc {
            font-size: 0.95rem;
            color: #444;
            margin-bottom: 16px;
        }

        .entry-links a {
            display: inline-block;
            color: #0066cc;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            margin-right: 16px;
        }

        .entry-links a:hover {
            text-decoration: underline;
        }

        .boinc-card {
            background: #fff;
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 40px;
        }

        .boinc-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }

        .boinc-value {
            font-size: 1.15rem;
            font-weight: 600;
            color: #111;
            letter-spacing: -0.3px;
        }

        .boinc-label {
            font-size: 0.75rem;
            color: #888;
            margin-top: 2px;
        }

        .boinc-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #111;
        }

        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #bbb;
            flex-shrink: 0;
        }

        .dot.on {
            background: #27ae60;
        }

        .boinc-note {
            font-size: 0.75rem;
            color: #aaa;
            margin-top: 12px;
        }

        .widget-section {
            margin-top: 48px;
        }

        .widget-section h2 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 4px;
            letter-spacing: -0.3px;
        }

        .widget-section p {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 16px;
        }

        .widget-card {
            background: #fff;
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            padding: 24px;
        }

        .empty {
            text-align: center;
            color: #999;
            padding: 60px 20px;
        }

        @media (max-width: 480px) {
            body {
                padding: 30px 16px;
            }
            .entry {
                padding: 20px;
            }
            .boinc-card {
                padding: 20px;
            }
            .widget-card {
                padding: 16px;
            }
        }
    </style>
<base target="_blank">
</head>
<body>
    <div class="container">
        <h1>Sharing_Page</h1>
        <p class="subtitle">Adam</p>

        <div class="boinc-card">
            <div class="entry-header">
                <div class="entry-title">Einstein@Home</div>
                <span class="badge boinc">BOINC</span>
            </div>
            <a href="https://einsteinathome.org/de/account/336577" target="_blank" rel="noopener noreferrer">
                <img src="https://boincstats.com" alt="Adam's BOINC Stats Banner" style="display:block;max-width:100%;height:auto;">
            </a>
        </div>

        <div id="entries"></div>
        </div>
    </div>



    <script>
        // add entries above the marked line
        const entries = [
            {
                title: "Neutron Stars; When Gravity Outweighs Atomic Physics",
                date: "21.08.2026",
                type: "pdf",
                description: "Talking about neutron stars",
                links: [
                    { label: "Open PDF →", url: "./Neutron Stars; When gravity outweighs atomic Physic.pdf" }
                ]
            },
            {
                title: "Gravity; Why It's Not a Force",
                date: "17.06.2026",
                type: "pdf",
                description: "Proving that gravity is not a force",
                links: [
                    { label: "Open PDF →", url: "./Gravity; Why Its Not a Force.pdf" }
                ]
            },
            {
                title: "Black Holes; We Don't Know Is Not an Equation",
                date: "16.06.2026",
                type: "pdf",
                description: "Counter argument in the black hole debate",
                links: [
                    { label: "Open PDF →", url: "./Black Holes; We dont Know is not an equation.pdf" }
                ]
            }
        ];

        const badgeLabels = { pdf: "PDF", "3d": "3D File", project: "Project" };

        const container = document.getElementById('entries');

        if (entries.length === 0) {
            container.innerHTML = '<div class="empty">Nothing here yet. Add an entry above!</div>';
        } else {
            entries.forEach(item => {
                const div = document.createElement('div');
                div.className = 'entry';
                const linksHtml = item.links
                    .map(l => `<a href="${l.url}" target="_blank" rel="noopener">${l.label}</a>`)
                    .join('');
                div.innerHTML = `
                    <div class="entry-header">
                        <div class="entry-title">${item.title}</div>
                        <span class="badge ${item.type}">${badgeLabels[item.type] || item.type}</span>
                    </div>
                    <div class="entry-date">${item.date}</div>
                    <div class="entry-desc">${item.description}</div>
                    <div class="entry-links">${linksHtml}</div>
                `;
                container.appendChild(div);
            });
        }
    </script>
</body>
</html>
